apiVersion: apps/v1
kind: Deployment
metadata:
  name: steiner-api
  namespace: steiner
  labels: {app: steiner-api, app.kubernetes.io/part-of: steiner}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: steiner-api}}
  template:
    metadata:
      labels: {app: steiner-api}
      annotations: {steiner/api-sha: "BUNDLE_SHA"}
    spec:
      # homelab workload: no trading-pool toleration -> stays off trading nodes
      securityContext: {runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, fsGroup: 65534, seccompProfile: {type: RuntimeDefault}}
      initContainers:
      - name: unpack
        image: busybox:1.36
        command: ["sh","-c","mkdir -p /opt/steiner-api && cat $(ls /bundle/*/part-* | sort -t- -k2 -n) | tar -xz -C /opt/steiner-api && ls -la /opt/steiner-api /opt/steiner-api/api /opt/steiner-api/research"]
        volumeMounts: [{name: apidata, mountPath: /opt/steiner-api}, BUNDLE_MOUNTS]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      containers:
      - name: api
        image: python:3.12-alpine
        command: ["python3","-u","/opt/steiner-api/api/server.py"]
        ports: [{containerPort: 8080, name: http}]
        env:
        - {name: PORT, value: "8080"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: STEINER_INDEX, value: /opt/steiner-api/research/index.json}
        - {name: STEINER_PASSAGES, value: /opt/steiner-api/research/passages.jsonl}
        - {name: OPENAI_MODEL, value: gpt-4o-mini}
        - {name: ANTHROPIC_MODEL, value: claude-3-5-haiku-latest}
        - name: OPENAI_API_KEY
          valueFrom: {secretKeyRef: {name: steiner-llm, key: OPENAI_API_KEY, optional: true}}
        - name: ANTHROPIC_API_KEY
          valueFrom: {secretKeyRef: {name: steiner-llm, key: ANTHROPIC_API_KEY, optional: true}}
        - name: LLM_PROVIDER
          valueFrom: {secretKeyRef: {name: steiner-llm, key: LLM_PROVIDER, optional: true}}
        volumeMounts:
        - {name: apidata, mountPath: /opt/steiner-api, readOnly: true}
        readinessProbe: {httpGet: {path: /api/health, port: 8080}, periodSeconds: 10, timeoutSeconds: 3}
        livenessProbe: {httpGet: {path: /api/health, port: 8080}, periodSeconds: 30, timeoutSeconds: 3}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 20m, memory: 64Mi}, limits: {memory: 320Mi}}
      volumes:
      - {name: apidata, emptyDir: {sizeLimit: 80Mi}}
      BUNDLE_VOLUMES
