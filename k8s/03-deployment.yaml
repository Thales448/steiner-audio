apiVersion: apps/v1
kind: Deployment
metadata:
  name: steiner
  namespace: steiner
  labels: {app: steiner, app.kubernetes.io/part-of: steiner}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector: {matchLabels: {app: steiner}}
  template:
    metadata:
      labels: {app: steiner}
      annotations: {steiner/bundle-sha: "BUNDLE_SHA"}
    spec:
      # homelab workload: no trading-pool toleration -> lands on worker3
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101, fsGroup: 101, seccompProfile: {type: RuntimeDefault}}
      initContainers:
      - name: unpack
        image: busybox:1.36
        command: ["sh","-c","cat $(ls /bundle/*/part-* | sort -t- -k2 -n) | tar -xz -C /site && ls /site"]
        volumeMounts: [{name: site, mountPath: /site}, BUNDLE_MOUNTS]
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
      containers:
      - name: web
        image: nginxinc/nginx-unprivileged:1.27-alpine
        ports: [{containerPort: 8080, name: http}]
        volumeMounts:
        - {name: site, mountPath: /usr/share/nginx/html, readOnly: true}
        - {name: conf, mountPath: /etc/nginx/conf.d, readOnly: true}
        readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 30}
        securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
        resources: {requests: {cpu: 10m, memory: 24Mi}, limits: {memory: 128Mi}}
      volumes:
      - {name: site, emptyDir: {sizeLimit: 64Mi}}
      - {name: conf, configMap: {name: steiner-nginx}}
      BUNDLE_VOLUMES
