# Example only. Do not commit real keys.
# Create the secret in the steiner namespace (this file is not applied by deploy.sh):
#
#   kubectl -n steiner create secret generic steiner-llm \
#     --from-literal=OPENAI_API_KEY='sk-...' \
#     --from-literal=ANTHROPIC_API_KEY='' \
#     --from-literal=LLM_PROVIDER='' \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# LLM_PROVIDER is optional: openai or anthropic. If empty, a set Anthropic key
# is used, otherwise OpenAI. Either key alone is enough. With neither key the
# API still answers from the research index.
apiVersion: v1
kind: Secret
metadata:
  name: steiner-llm
  namespace: steiner
  labels: {app.kubernetes.io/part-of: steiner}
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  LLM_PROVIDER: ""
